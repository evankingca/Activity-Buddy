{% extends 'browsing/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}

<div class="md:mt-40 mt-30 mb-8 mx-auto max-w-4xl flex flex-col md:flex-row gap-10 justify-between items-center w-full">
    <div class="md:max-w-100 max-w-60 w-full">
        {% include 'browsing/svgs/logo-text-adaptive.html' %}
    </div>

    <form class="card card-tertiary dark:card-primary flex flex-col gap-4 max-w-100 w-full">
        <h1 class="text-center">Login</h1>

        <div class="flex flex-col">
            <label for="username">Username</label>
            <input class="input" id="username" type="text" name="username" placeholder="Username" />
        </div>
        <div class="flex flex-col">
            <label for="password">Password</label>
            <input class="input" id="password" type="password" name="password" placeholder="Password" />
        </div>

        <button class="btn btn-primary">Login</button>
    </form>
</div>

{% endblock %}
