{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Site title goes here{% endblock %}</title>
    {% tailwind_css %}
    {% block extra_head %}{% endblock %}
</head>

<body>
    <header>
        <nav class="flex flex-row justify-between gap-2 py-2 px-4">
            <span>GymGolf</span>
            <div>
                <a href="/">Home</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="py-2 px-4">
        <p>&copy; 2026 Shoppature</p>
    </footer>
</body>

</html>
