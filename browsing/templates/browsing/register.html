{% extends 'browsing/base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="container mx-auto my-15">
    <form class="mt-3 p-7 card">
        <h1 class="text-4xl text-center">Register</h1>
        <div class="flex flex-col items-center mx-30">
            <div class="w-full flex flex-row gap-6 justify-center">
                <label class="my-6 w-40" for="username">Username</label>
                <input class="bg-white border border-solid border-black rounded-md px-3 my-6 placeholder:text-gray-400" id="username" type="text" name="username" placeholder="Username" />
            </div>
            <div class="w-full flex flex-row gap-6 justify-center">
                <label class="my-6 w-40" for="password">Password</label>
                <input class="bg-white border border-solid border-black rounded-md px-3 my-6 placeholder:text-gray-400" id="password" type="password" name="password" placeholder="Password" />
            </div>
            <div class="w-full flex flex-row gap-6 justify-center">
                <label class="my-6 w-40" for="email">Email</label>
                <input class="bg-white border border-solid border-black rounded-md px-3 my-6 placeholder:text-gray-400" id="email" type="email" name="email" placeholder="Email" />
            </div>
            <div class="w-full flex flex-row gap-6 justify-center">
                <label class="my-6 w-40" for="summary">Profile Sumamry</label>
                <textarea class="bg-white border border-solid border-black rounded-md px-3 my-6 placeholder:text-gray-400" id="summary" type="summary" name="summary" placeholder="Tell buddies a bit about yourself..."></textarea>
            </div>
            <div class="w-full flex flex-row gap-6 justify-center">
                <label class="my-6 w-40" for="experience">Experience</label>
                <select class="bg-white border border-solid border-black rounded-md px-3 my-6 text-gray-400" id="experience" type="experience" name="experience">
                    <option value="" selected>Select Experience level...</option>
                    <option value="1">Beginner</option>
                    <option value="2">Intermediate</option>
                    <option value="3">Advanced</option>
                </select>
            </div>
            <div class="grid grid-cols-6 gap-4 my-6">
                <div class="col-span-6 col-start-2">
                    <p class="ps-15 w-40">Goals</p>
                </div>
                <div class="col-start-2 col-span-2 ps-20">
                    <input type="checkbox" id="buildMuscle" name="goals" value="1"/>
                    <label for="buildMuscle">Build Muscle</label>
                </div>
                <div>
                    <input type="checkbox" id="weightLoss" name="goals" value="2"/>
                    <label for="weightLoss">Weight Loss</label>
                </div>
                <div class="col-start-2 col-span-2 ps-20">
                    <input type="checkbox" id="generalFitness" name="goals" value="3"/>
                    <label for="generalFitness">General Fitness</label>
                </div>
                <div class="col-span-2">
                    <input type="checkbox" id="strengthTraining" name="goals" value="4"/>
                    <label for="strengthTraining">Strength Training</label>
                </div>
                <div class="col-start-2 col-span-2 ps-20">
                    <input type="checkbox" id="powerLifting" name="goals" value="5"/>
                    <label for="powerLifting">Powerlifting</label>
                </div>
                <div>
                    <input type="checkbox" id="bodyBuilding" name="goals" value="6"/>
                    <label for="bodyBuilding">Bodybuilding</label>
                </div>
            </div>
            <div class="grid grid-cols-6 gap-4 my-6">
                <div class="col-span-6 col-start-2">
                    <p class="ps-25">Training Style</p>
                </div>
                <div class="col-start-2 col-span-2 ps-35">
                    <input type="checkbox" id="weightLifting" name="training" value="1"/>
                    <label for="weightLifting">Weightlifting</label>
                </div>
                <div>
                    <input type="checkbox" id="powerLifting" name="training" value="2"/>
                    <label for="powerLifting">Powerlifting</label>
                </div>
                <div class="col-start-2 col-span-2 ps-35">
                    <input type="checkbox" id="bodyBuilding" name="training" value="3"/>
                    <label for="bodyBuilding">Bodybuilding</label>
                </div>
                <div class="col-span-2">
                    <input type="checkbox" id="crossFit" name="trainiing" value="4"/>
                    <label for="crossFit">CrossFit</label>
                </div>
                <div class="col-start-2 col-span-2 ps-35">
                    <input type="checkbox" id="cardio" name="training" value="5"/>
                    <label for="cardio">Cardio</label>
                </div>
                <div>
                    <input type="checkbox" id="functionalFitness" name="training" value="6"/>
                    <label for="functionalFitness">Functional Fitness</label>
                </div>
            </div>
            <div class="w-full flex flex-row gap-6 justify-center">
                <label class="my-6 w-40" for="goals">Gym Frequency</label>
                <select class="bg-white border border-solid border-black rounded-md px-3 my-6 text-gray-400" id="frequency" type="frequency" name="frequency">
                    <option value="" selected>Select Frequency...</option>
                    <option value="1">1-2 times/week</option>
                    <option value="2">3-4 times/week</option>
                    <option value="3">5+ times/week</option>
                </select>
            </div>
            <div class="grid grid-cols-6 gap-4 my-6">
                <div class="col-span-6 col-start-2">
                    <p class="ps-25">Preferred Workout Time</p>
                </div>
                <div class="col-start-2 col-span-2 ps-35">
                    <input type="checkbox" id="earlyMorning" name="time" value="1"/>
                    <label for="earlyMorning">Early Morning</label>
                </div>
                <div>
                    <input type="checkbox" id="morning" name="time" value="2"/>
                    <label for="morning">Morning</label>
                </div>
                <div>
                    <input type="checkbox" id="afternoon" name="time" value="3"/>
                    <label for="afternoon">Afternoon</label>
                </div>
                <div class="col-start-2 col-span-2 ps-35">
                    <input type="checkbox" id="evening" name="time" value="4"/>
                    <label for="evening">Evening</label>
                </div>
                <div>
                    <input type="checkbox" id="lateNight" name="time" value="5"/>
                    <label for="lateNight">Late Night</label>
                </div>
            </div>
            <button class="btn btn-secondary my-6">Register</button>
        </div>
    </form>
</div>
{% endblock %}
