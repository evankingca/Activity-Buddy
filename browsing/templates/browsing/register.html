{% extends 'browsing/base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="container mx-auto my-15">
    <form class="mt-3 p-7 card">
        <h1 class="text-4xl text-center">Register</h1>
        <div class="flex flex-col items-center mx-30">
            <div class="w-full flex flex-row justify-around">
                <label class="my-6" for="username">Username</label>
                <input class="bg-white border border-solid border-black rounded-md px-3 my-6 placeholder:text-gray-400" id="username" type="text" name="username" placeholder="Username" />
            </div>
            <div class="w-full flex flex-row justify-around">
                <label class="my-6" for="password">Password</label>
                <input class="bg-white border border-solid border-black rounded-md px-3 my-6 placeholder:text-gray-400" id="password" type="password" name="password" placeholder="Password" />
            </div>
            <div class="w-full flex flex-row justify-around">
                <label class="my-6" for="email">Email</label>
                <input class="bg-white border border-solid border-black rounded-md px-3 my-6 placeholder:text-gray-400" id="email" type="email" name="email" placeholder="Email" />
            </div>
            <div class="w-full flex flex-row justify-around">
                <label class="my-6" for="summary">Profile Sumamry</label>
                <textarea class="bg-white border border-solid border-black rounded-md px-3 my-6 placeholder:text-gray-400" id="summary" type="summary" name="summary" placeholder="Tell buddies a bit about yourself..."></textarea>
            </div>
            <div class="w-full flex flex-row justify-around">
                <label class="my-6" for="preference_1">Preference Example</label>
                <select class="bg-white border border-solid border-black rounded-md px-3 my-6 text-gray-400" id="preference_1" type="preference_1" name="preference_1">
                    <option value="" selected>Select Preferences...</option>
                    <option value="1">Example 1</option>
                    <option value="2">Example 2</option>
                </select>
            </div>
            <div class="w-full flex flex-row justify-around">
                <label class="my-6" for="preference_2">Preference Example</label>
                <select class="bg-white border border-solid border-black rounded-md px-3 my-6 text-gray-400" id="preference_2" type="preference_2" name="preference_2">
                    <option value="" selected>Select Preferences...</option>
                    <option value="1">Example 1</option>
                    <option value="2">Example 2</option>
                </select>
            </div>
            <button class="btn btn-secondary my-6">Register</button>
        </div>
    </form>
</div>
{% endblock %}
